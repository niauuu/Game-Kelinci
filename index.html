<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelinci Lompat</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGO -->
<img src="logo.png" class="logo">
  <img src="1.jpg" alt="Deskripsi gambar"> 
<img src="2.jpg" alt="Deskripsi gambar">
<img src="3.jpg" alt="Deskripsi gambar">
<img src="4.jpg" alt="Deskripsi gambar">
<img src="5.jpg" alt="Deskripsi gambar">  

<!-- MENU -->
<div id="menu">
    <h1>🐰 KELINCI LOMPAT 🥕</h1>

    <button id="startBtn">START GAME</button>

    <p>
        Lompati batu dan ambil wortel.
    </p>
</div>

<!-- HUD -->
<div id="hud">

    <div class="box">
        ❤️ Nyawa :
        <span id="life">3</span>
    </div>

    <div class="box">
        ⭐ Level :
        <span id="level">1</span>
    </div>

    <div class="box">
        🥕 Point :
        <span id="score">0</span>
    </div>

    <div class="box">
        🏆 High Score :
        <span id="highscore">0</span>
    </div>

</div>

<!-- GAME -->
<div id="game">

    <!-- Ground -->
    <div id="ground"></div>

    <!-- Rabbit -->
    <div id="rabbit">
        🐰
    </div>

    <!-- Stone -->
    <div id="stone">
        🪨
    </div>

    <!-- Carrot -->
    <div id="carrot">
        🥕
    </div>

</div>

<!-- GAME OVER -->
<div id="gameOver">

    <h1>GAME OVER</h1>

    <h2>
        Point :
        <span id="finalScore"></span>
    </h2>

    <button onclick="restartGame()">
        MAIN LAGI
    </button>

</div>

<!-- Audio -->

<audio id="jumpSound">
    <source src="jump.mp3">
</audio>

<audio id="coinSound">
    <source src="coin.mp3">
</audio>

<audio id="hitSound">
    <source src="hit.mp3">
</audio>

<audio id="bgMusic" loop>
    <source src="bg.mp3">
</audio>

<script src="script.js"></script>

</body>
</html>
